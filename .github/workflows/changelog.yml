name: Changelog
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  check-changelog:
    name: Entry Check
    runs-on: ubuntu-slim
    steps:
      - name: Check for a changelog entry
        uses: tarides/changelog-check-action@421f617d0dc83fb30b0a9c0e50c4df508ce33458
        with:
          changelog: doc/changes
