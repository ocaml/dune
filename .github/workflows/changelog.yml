name: Changelog
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
    branches:
      - main
permissions:
  contents: read
concurrency:
  # Metadata edits must not cancel active checks.
  group: >-
    ${{ github.workflow }}-${{ github.event.action == 'edited' &&
    !github.event.changes.base.ref && github.run_id ||
    github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  check-changelog:
    if: github.event.action != 'edited' || github.event.changes.base.ref
    name: >-
      ${{ github.event.action == 'edited' &&
      !github.event.changes.base.ref && 'Ignored metadata edit' ||
      'Entry Check' }}
    runs-on: ubuntu-slim
    steps:
      - name: Check for a changelog entry
        uses: tarides/changelog-check-action@3a9f4922fcc11321bc08b8643b5d1f89698dfa6e
        with:
          changelog: doc/changes
