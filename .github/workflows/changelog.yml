name: Changelog
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches:
      - main
      - '*-rc'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  check-changelog:
    name: Entry Check
    runs-on: ubuntu-slim
    steps:
      - name: Check for a changelog entry
        uses: tarides/changelog-check-action@d03bac947fdced6ccceb2a7c6f75b2c4ad1408ef
        with:
          changelog: doc/changes
