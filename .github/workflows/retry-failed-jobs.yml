name: Retry failed jobs

on:
  workflow_run:
    workflows: [CI, Binaries, Changelog]
    types: [completed]

permissions:
  actions: write

concurrency:
  group: retry-failed-jobs-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  retry:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const target = {
              ...context.repo,
              run_id: context.payload.workflow_run.id,
            };
            const {data: run} = await github.rest.actions.getWorkflowRun(target);
            if (
              run.run_attempt === 1 &&
              run.status === 'completed' &&
              run.conclusion === 'failure'
            ) {
              await github.rest.actions.reRunWorkflowFailedJobs(target);
            }
